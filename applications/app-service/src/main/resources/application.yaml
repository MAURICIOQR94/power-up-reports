server:
  port: 8082
spring:
  application:
    name: "Reports"
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    active: "local"
aws:
  dynamodb:
    endpoint: "http://localhost:8000"
  region: "${AWS_REGION}"
entrypoint:
  sqs:
    region: ${AWS_REGION}
    queueUrl: ${AWS_QUEUE_REPORTS_URL}
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  reactive-web:
    base-path: "api/v1/reportes"

jwt:
  secret: ${JWT_SECRET}
